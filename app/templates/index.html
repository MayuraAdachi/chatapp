{% set sub_title = "トップページ" %}
{% include 'common/header.html' %}
<div class="container">
    <div class="form-box">
        <h2>ログイン</h2>
        <form method="post" class="login-form">
            <div class="input-group">
                <input name="username" placeholder="ユーザー名 または メールアドレス" class="input-full login-input" />
                {% if errors and errors.username %}
                    <div class="error-message">{{ errors.username }}</div>
                {% endif %}
            </div>
            <div class="input-group">
                <input name="password" type="password" placeholder="パスワード" class="input-full login-input" />
                {% if errors and errors.password %}
                    <div class="error-message">{{ errors.password }}</div>
                {% endif %}
            </div>
            <button class="btn login-btn" type="submit">ログイン</button>
        </form>
        <div class="or">または</div>
        <form method="get" action="{{ url_for('auth.regist') }}" class="regist-form">
            <button class="btn regist-btn" type="submit">アカウントを作成</button>
        </form>
        <div style="margin-top:16px;">
            <a href="/">← トップへ戻る</a>
        </div>
    </div>
</div>
{% include 'common/footer.html' %}
